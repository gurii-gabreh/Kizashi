name = "kizashi-app"
main = "worker/index.js"
compatibility_date = "2025-01-01"

[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "kizashi-app-local"
# 実際にCloudflareアカウント上でD1データベースを作成した際に発行される
# 本物のIDに差し替える必要がある（`wrangler d1 create kizashi-app-local`）。
# ローカル開発（--local、このリポジトリでの検証はすべてこちら）ではこの値は
# 使われないため、プレースホルダのままで問題ない。
database_id = "00000000-0000-0000-0000-000000000000"

[triggers]
# 毎日19:00 UTC（＝日本時間 翌4:00、負荷の低い時間帯）に事案の自動削除を実行
crons = ["0 19 * * *"]

[ai]
# 傾聴AIチャット（worker/routes/chat.js）用。
#
# ⚠️ 注意：このバインディングが存在すると、`wrangler dev`（--localでも）は
# 起動時にCloudflareの実サービスへ接続を試み、ネットワークアクセスが
# 制限された環境（このセッションのサンドボックス等）では起動そのものが
# 失敗する（D1と異なりWorkers AIにはローカルエミュレーションが存在しない
# ため）。ローカルで他の機能を検証する際は、この[ai]ブロックを一時的に
# コメントアウトすること（env.AIがundefinedになり、chat.jsはスタブ応答を
# 返すフォールバックに入るため、それ以外の検証には支障はない）。
# 実際のAI応答を確認するには、Cloudflareアカウントでログイン後に
# `wrangler dev --remote` を使うか、本番デプロイ後に確認する。
binding = "AI"
